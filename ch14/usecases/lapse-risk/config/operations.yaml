# yaml-language-server: $schema=../../../.pipewright-schemas/usecase-part.schema.json
# Using the model (Chapter 13): the weekly list of who to win back, written by the scoring pipeline.
inference:
  output_table: lapse_risk_scores        # one row per customer: return_probability, predicted_return, lapse_risk
  decision_threshold: 0.5

# Watching it (Chapter 14): every scoring run compares what it scored with what the model was trained on.
monitoring:
  output_table: lapse_risk_monitoring    # one row per scoring run: drift, performance, whether it alerted
  drift: { enabled: true, method: psi, threshold: 0.2 }   # each feature against its training distribution
  prediction_drift: { enabled: true, threshold: 0.2 }     # the scores themselves against training's
  performance:                           # once outcomes are known: the model measured on what customers did
    enabled: false                       # off: Pipewright 1.1 joins outcomes to each customer's latest score, which
                                         # is the wrong score once a newer week is scored. sql/performance.sql joins on
                                         # customer and cut-off instead (Chapter 14)
    labels: { table: lapse_risk_outcomes, key: customer_id, label: returned }   # sql/lapse_risk_outcomes.sql
    metric: auc
    min: 0.7                             # below this the model no longer ranks customers usefully
  alerts:                                # `pipewright alerts sync` turns these into email alerts
    notify: [ml-team@example.com]        # your team's address; a distribution list works
    events: [monitoring.alert]
    severity: WARNING

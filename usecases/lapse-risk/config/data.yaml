# yaml-language-server: $schema=../../../.pipewright-schemas/usecase-part.schema.json
# The data contract: what the model's data must look like, whichever table each column comes from. Data that
# breaks it stops the run before training.
data:
  contract:
    min_rows: 1000                       # a near-empty export is a failed export
    unique: [customer_id, snapshot_date] # one row per customer per cut-off
    allow_extra_columns: false           # an unknown column means the export changed: stop and ask
    columns:
      - { name: customer_id,       type: string,  required: true, max_null_fraction: 0 }
      - { name: snapshot_date,     type: date,    required: true, max_null_fraction: 0 }
      - { name: recency_days,      type: integer, min: 0, max: 365 }
      - { name: orders_12m,        type: integer, min: 1 }
      - { name: spend_12m_gbp,     type: float,   min: 0 }
      - { name: distinct_products, type: integer, min: 1 }
      - { name: country,           type: string,  max_null_fraction: 0.01 }
      - { name: returned,          type: integer, allowed: [0, 1], max_null_fraction: 0 }
  label: { column: returned }            # 1: a purchase within 90 days of the cut-off; lapse risk = 1 - score
  split: { strategy: time, time_column: snapshot_date }
  label_source:                          # the label from the purchases themselves, once its window has closed
    table: bq://pw_retail.customer_purchases
    time_column: purchased_at
    window_days: 90
  snapshot_table: lapse_risk_snapshots   # exactly what each run read; `pipewright run --replay <run_id>`
  features_from:                         # the run's source is the entity table: who, as of when, and the label
    entity: { columns: [customer_id], time_column: snapshot_date }
    sources:
      - table: bq://pw_retail.customer_activity          # the data team's feature table, one row per month
        features: [recency_days, orders_12m, spend_12m_gbp, distinct_products]

features:
  exclude: [customer_id, country]        # country stays in the contract (and comes back in Chapter 10), not a feature

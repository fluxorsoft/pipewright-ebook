# Every setting of lapse-risk, as `pipewright resolve --env test` runs it (Pipewright 1.1.0).
# Unmarked: the team's own value, as written. `# default`: what Pipewright fills in when the key is left out.
# `# environments/test.yaml`: set for this environment only.
# The platform's values (runner, dataset, landing prefix) come from the environment manifest, not from here.
# Written by tools/all_settings.py. `pipewright explain <key>` explains any key.
apiVersion: pipewright/v1
kind: UseCase
metadata:
  name: lapse-risk
  owner: ml-team
spec:
  tenant: retail
  pipelines:
    training:
      file: training_pipeline.py
      function: churn_training_pipeline
  components:
    dir: components/
    requirements: components/requirements.txt
  framework: pytorch  # default
  triggers:
    # landing:  # not set by default
    schedules: []  # default
    api: true
  parameters:
    bq_dataset: ${resources.bigquery_dataset}
    model_display_name: ${model.name}
    raw_table: lapse_risk_raw_customers
    metrics_table: lapse_risk_model_metrics
  steps: {}  # default
  data:
    contract:
      min_rows: 1000
      unique: [customer_id, snapshot_date]
      allow_extra_columns: false
      columns:
        - {name: customer_id, type: string, required: true, max_null_fraction: 0}
        - {name: snapshot_date, type: date, required: true, max_null_fraction: 0}
        - {name: recency_days, type: integer, min: 0, max: 365}
        - {name: orders_12m, type: integer, min: 1}
        - {name: spend_12m_gbp, type: float, min: 0}
        - {name: distinct_products, type: integer, min: 1}
        - {name: country, type: string, max_null_fraction: 0.01}
        - {name: returned, type: integer, allowed: [0, 1], max_null_fraction: 0}
    label:
      column: returned
    split:
      strategy: time
      time_column: snapshot_date
      test_fraction: 0.2  # default
      validation_fraction: 0.0  # default
      seed: 42  # default
    features_from:
      entity:
        columns: [customer_id]
        time_column: snapshot_date
      sources:
        - {table: 'bq://pw_retail.customer_activity', features: [recency_days, orders_12m, spend_12m_gbp, distinct_products]}
    label_source:
      table: bq://pw_retail.customer_purchases
      time_column: purchased_at
      window_days: 90
      key: [customer_id]  # default
      cutoff_column: snapshot_date  # default
    snapshot_table: lapse_risk_snapshots
  features:
    include: [recency_days, orders_12m, spend_12m_gbp, distinct_products]  # default
    exclude: [customer_id, country]
  training:  # default
    hyperparameters: {}  # default
    seed: 42  # default
    experiment:  # default
      name: lapse-risk  # default
    tuning:  # default
      enabled: false  # default
      metric: auc  # default
      goal: maximize  # default
      max_trials: 8  # default
      parallel_trials: 4  # default
      search_space: {}  # default
  evaluation:
    primary_metric: auc  # default
    decision_threshold: 0.5  # default
    metrics: [accuracy, auc, calibration_error, f1, log_loss, pr_auc, precision, recall]  # default
    gates:
      - {metric: auc, min: 0.7}
    champion:  # default
      enabled: true  # default
      metric: auc  # default
      min_improvement: 0.0  # default
    slices: []  # default
    slice_gates: []  # default
  explainability:  # default
    enabled: false  # default
    method: permutation  # default
    top_k: 10  # default
  registry:  # default
    set_default: on_approval  # default
  model_card: {}  # default
  inference:  # default
    # output_table:  # not set by default
    decision_threshold: 0.5  # default
  monitoring:  # default
    drift:  # default
      enabled: false  # default
      method: psi  # default
      threshold: 0.2  # default
      features: [recency_days, orders_12m, spend_12m_gbp, distinct_products]  # default
    prediction_drift:  # default
      enabled: false  # default
      threshold: 0.2  # default
    performance:  # default
      enabled: false  # default
      # labels:  # not set by default
      metric: auc  # default
      # min:  # not set by default
    # output_table:  # not set by default
    alerts:  # default
      notify: []  # default
      events: [monitoring.alert]  # default
      severity: WARNING  # default
  retraining:  # default
    mode: 'off'  # default
    enabled: false  # default
    when: [schedule]  # default
    cooldown_days: 7  # default
    # source_uri:  # not set by default
    decisions:  # default
      notify: []  # default
      publish: false  # default
      escalate_after_days: 3  # default
      escalate_notify: []  # default
      digest: true  # default
    approvals:  # default
      required: []  # default
      separate_from_requester: true  # default
    snooze:  # default
      max_days: 30  # default
      reopen_when_worse_by: 0.1  # default
  data_protection:  # default
    personal_data_columns: []  # default
    # erasure:  # not set by default
  outputs:
    store: bigquery  # default
    # gcs:  # not set by default
    bigquery:
      tables:
        lapse_risk_raw_customers:
          schema: schemas/raw_customers.json
          partition:
            field: ingested_at
            type: DAY
          # cluster:  # not set by default
        lapse_risk_model_metrics:
          schema: schemas/model_metrics.json
          partition:
            field: evaluated_at
            type: DAY
          # cluster:  # not set by default
        lapse_risk_snapshots:
          schema: schemas/snapshots.json
          partition:
            field: ingested_at
            type: DAY
          # cluster:  # not set by default
      # retention_days:  # not set by default
  model:
    promotion: model  # default
    name: lapse-risk-classifier
    serving:  # default
      enabled: false  # default
      target: vertex  # default
      machine: n1-standard-2  # default
      replicas:  # default
        min: 1  # default
        max: 1  # default
  approvals:
    promote_model: auto  # environments/test.yaml
    deploy_model: manual  # default
    approvers: []  # default


# Generated by `pipewright ci init`, then changed (Chapter 16): on merge to main, release every changed use case to
# test only. Production is never released to: it receives the tested release by `pipewright promote`
# (pipewright-promote.yml), because environments/prod.yaml says `promotion: { from: test }`.
# Per use case and environment: tables sync -> release (image, templates, contract, verify, pointer) ->
# schedules sync -> alerts sync.
name: pipewright-release

on:
  push:
    branches: [main]
    paths: ["usecases/**", "environments/**", ".github/workflows/pipewright-*.yml", ".github/actions/pipewright-setup/**"]
  workflow_dispatch:
    inputs:
      usecase:
        description: "One use case to release (empty: every use case)"
        type: string
        default: ""

# bash -eo pipefail: a failing pipewright command fails its step even when its output is piped to tee.
defaults:
  run:
    shell: bash

permissions:
  contents: read
  id-token: write          # Workload Identity Federation

concurrency:
  group: pipewright-release
  cancel-in-progress: false      # never interrupt a release; the pointer move is atomic anyway

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      usecases: ${{ steps.changed.outputs.usecases }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        env:
          BEFORE: ${{ github.event.before }}
          ONE: ${{ inputs.usecase }}
        run: |
          if [ -n "$ONE" ]; then
            names="$ONE"
          elif [ "${{ github.event_name }}" != "push" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            names="ALL"
          else
            files="$(git diff --name-only "$BEFORE" HEAD)"
            if echo "$files" | grep -qE '^(environments/|\.github/)'; then
              names="ALL"
            else
              names="$(echo "$files" | grep '^usecases/' | cut -d/ -f2 | sort -u)"
            fi
          fi
          python - "$names" <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          names = sys.argv[1].split()
          if names == ["ALL"]:                                       # shared files changed, or a full run
              names = sorted(os.listdir("usecases"))
          names = [n.strip("/") for n in names if os.path.isfile(f"usecases/{n.strip('/')}/usecase.yaml")]
          print("usecases=" + json.dumps(names))
          PY

  release-test:
    needs: [changes]
    if: needs.changes.outputs.usecases != '[]'
    runs-on: ubuntu-latest
    environment: test
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        usecase: ${{ fromJSON(needs.changes.outputs.usecases) }}
    env:
      ENV: test
      UC: ${{ matrix.usecase }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pipewright-setup
        with:
          wif_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.PIPEWRIGHT_SERVICE_ACCOUNT }}
          pip_spec: ${{ vars.PIPEWRIGHT_PIP_SPEC }}
          pip_index: ${{ vars.PIPEWRIGHT_PIP_INDEX }}
          setup_tools: ${{ vars.PIPEWRIGHT_SETUP_TOOLS }}
      - name: Tables
        run: pipewright tables sync --env "$ENV" --usecase "$UC" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Release
        run: pipewright release --env "$ENV" --usecase "$UC" --skip-tables | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Schedules
        if: vars.PIPEWRIGHT_SCHEDULES != 'off'
        run: pipewright schedules sync --env "$ENV" --usecase "$UC" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Alerts
        run: pipewright alerts sync --env "$ENV" --usecase "$UC" | tee -a "$GITHUB_STEP_SUMMARY"

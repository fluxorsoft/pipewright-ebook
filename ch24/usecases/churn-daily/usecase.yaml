# yaml-language-server: $schema=../../.pipewright-schemas/usecase.schema.json
# churn-daily: created from the Pipewright minimal example (pipewright new-usecase --from minimal).
# Only what is required, plus one evaluation gate. Everything else has a default: `pipewright resolve --env <env>`
# shows the result, `pipewright explain <key>` what any key means. The churn example shows every option.
apiVersion: pipewright/v1
kind: UseCase
metadata:
  name: churn-daily
  owner: ml-team@example.com

spec:
  tenant: retail                      # given to you by the platform team
  include: [config/*.yaml]               # config/data.yaml: the data contract, label and split

  pipelines:
    training: { file: training_pipeline.py, function: churn_training_pipeline }
  components: { dir: components/, requirements: components/requirements.txt }

  model:
    name: churn-daily-classifier
    # serving:                         # Chapter 24: on the team's shared pool, behind a private endpoint
    #   enabled: true
    #   pool: retail-shared            # no machine or replicas with a pool

  triggers:
    landing: null      # features_from: runs read the entity table (bq://)
    api: true                            # or `pipewright run --source-uri gs://... or bq://...`

  parameters:                            # the training pipeline's own parameters
    bq_dataset: ${resources.bigquery_dataset}
    model_display_name: ${model.name}
    raw_table: churn_daily_raw_customers
    metrics_table: churn_daily_model_metrics

  evaluation:
    gates:
      - { metric: auc, min: 0.7 }        # a model below this is not registered

  outputs:                               # tables the pipeline writes, created by `pipewright tables sync`
    bigquery:
      tables:
        churn_daily_raw_customers: { schema: schemas/raw_customers.json, partition: { field: ingested_at, type: DAY } }
        churn_daily_model_metrics: { schema: schemas/model_metrics.json, partition: { field: evaluated_at, type: DAY } }
